<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
<style>
text{fill:#1b2330;font-size:12px;font-family:"IBM Plex Sans",Arial,sans-serif}
.mono{font-family:Consolas,"IBM Plex Mono",monospace;font-size:11px}
.mut{fill:#5a6577}.lbl{font-size:11px;font-family:Consolas,monospace;fill:#5a6577}
.warn{fill:#c2410c}

.flow-o{stroke-dasharray:7 5;animation:flow 0.9s linear infinite}
.flow-k{stroke-dasharray:7 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.inst{animation:glow 3s ease-in-out infinite}
.cw{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{stroke:#c2410c;stroke-width:2.5}}
@media (prefers-reduced-motion: reduce){.flow-o,.flow-k,.inst,.cw{animation:none}.dot{display:none}}
</style>
<rect width="1000" height="750" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2330"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
</defs>
<text x="20" y="22" font-size="15" font-weight="700">deham9-dev: multi-AZ WordPress (us-east-1)</text>
<rect x="200" y="34" width="140" height="30" rx="4" fill="none" stroke="#1b2330"/><text x="270" y="54" text-anchor="middle">Internet (HTTPS)</text>
<line class="flow-o" x1="340" y1="49" x2="368" y2="49" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/>
<rect x="370" y="30" width="160" height="38" rx="4" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="450" y="46" text-anchor="middle" font-weight="600">CloudFront</text><text class="mono mut" x="450" y="60" text-anchor="middle">edge cache, HTTPS</text>
<line class="flow-o" x1="450" y1="68" x2="450" y2="92" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/><text class="lbl" x="460" y="84">HTTP + secret header</text>
<rect x="20" y="92" width="700" height="580" rx="8" fill="#eef2f7" stroke="#8793a6" stroke-width="1.5"/><text class="mono" x="34" y="112">VPC 10.0.0.0/16</text>
<rect x="380" y="98" width="140" height="26" rx="4" fill="#fff" stroke="#1b2330"/><text x="450" y="115" text-anchor="middle">Internet gateway</text>
<line class="flow-o" x1="450" y1="124" x2="450" y2="148" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/>
<rect x="140" y="148" width="540" height="40" rx="4" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="410" y="164" text-anchor="middle" font-weight="600">ALB deham9-dev-alb</text><text class="mono mut" x="410" y="179" text-anchor="middle">listener :80 (CloudFront only), deletion protection off</text>
<text class="lbl" x="200" y="212" text-anchor="middle">AZ us-east-1a</text><text class="lbl" x="530" y="212" text-anchor="middle">AZ us-east-1b</text>
<rect x="40" y="220" width="320" height="200" rx="6" fill="#e3eefb" stroke="#8793a6"/><text class="mono" x="52" y="238">public-1 10.0.1.0/24</text>
<rect x="370" y="220" width="330" height="200" rx="6" fill="#e3eefb" stroke="#8793a6"/><text class="mono" x="382" y="238">public-2 10.0.3.0/24</text>
<line class="flow-o" x1="110" y1="188" x2="110" y2="256" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/>
<line class="flow-o" x1="266" y1="188" x2="266" y2="256" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/>
<line class="flow-o" x1="530" y1="188" x2="530" y2="256" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/>
<rect x="60" y="256" width="120" height="58" rx="4" fill="#fff" stroke="#1b2330"/><text x="120" y="278" text-anchor="middle" font-weight="600">EC2 standalone</text><text class="mono mut" x="120" y="294" text-anchor="middle">t4g.micro, count 1</text><text class="mono mut" x="120" y="307" text-anchor="middle">same boot script</text>
<rect class="inst" x="196" y="256" width="140" height="58" rx="4" fill="#fff" stroke="#1b2330"/><text x="266" y="278" text-anchor="middle" font-weight="600">3 x ASG instance</text><text class="mono mut" x="266" y="294" text-anchor="middle">t4g.micro</text><text class="mono mut" x="266" y="307" text-anchor="middle">launch template</text>
<rect class="inst" x="460" y="256" width="140" height="58" rx="4" fill="#fff" stroke="#1b2330"/><text x="530" y="278" text-anchor="middle" font-weight="600">2 x ASG instance</text><text class="mono mut" x="530" y="294" text-anchor="middle">t4g.micro</text><text class="mono mut" x="530" y="307" text-anchor="middle">launch template</text>
<rect x="186" y="244" width="424" height="116" rx="6" fill="none" stroke="#1b2330" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="398" y="330" text-anchor="middle" font-weight="600">Auto Scaling Group deham9-dev-asg</text>
<text class="lbl" x="398" y="343" text-anchor="middle">min 5 / desired 5 / max 6, arm64, CPU + request scaling</text>
<text class="lbl" x="398" y="356" text-anchor="middle">off hours: 1 instance, 19:00-06:00 UTC and weekends</text>
<text class="lbl" x="52" y="410">SSH closed (SSM Session Manager)</text>
<rect x="40" y="440" width="320" height="140" rx="6" fill="#efeaf7" stroke="#8793a6"/><text class="mono" x="52" y="458">private-1 10.0.2.0/24</text>
<rect x="370" y="440" width="330" height="140" rx="6" fill="#efeaf7" stroke="#8793a6"/><text class="mono" x="382" y="458">private-2 10.0.4.0/24</text>
<rect x="110" y="482" width="150" height="58" rx="4" fill="#fff" stroke="#1b2330"/><text x="185" y="504" text-anchor="middle" font-weight="600">Aurora instance 0</text><text class="mono mut" x="185" y="520" text-anchor="middle">db.t3.small (writer)</text><text class="mono mut" x="185" y="533" text-anchor="middle">deham9-dev-aurora-0</text>
<rect x="100" y="466" width="510" height="108" rx="6" fill="none" stroke="#1b2330" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="mono" x="355" y="556" text-anchor="middle" style="font-weight:600">Aurora cluster deham9-dev-aurora</text>
<text class="lbl" x="355" y="569" text-anchor="middle">backups 1d, deletion protection off</text>
<line class="flow-k" x1="266" y1="314" x2="200" y2="482" stroke="#1b2330" stroke-width="1.5" marker-end="url(#ar)"/>
<line class="flow-k" x1="530" y1="314" x2="220" y2="482" stroke="#1b2330" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="lbl" x="540" y="420">MySQL :3306</text>
<rect x="60" y="364" width="120" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 3"/><text class="mut" x="120" y="379" text-anchor="middle">NAT gateway + EIP</text><text class="mono warn" x="120" y="393" text-anchor="middle">DISABLED</text>
<line x1="120" y1="440" x2="120" y2="400" stroke="#9ca3af" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="mono mut" x="52" y="620">enable_nat_gateway = false: NAT is off, private subnets have no internet route</text>
<rect x="24" y="634" width="692" height="30" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="370" y="650" text-anchor="middle" font-weight="600">EFS deham9-dev-wordpress-efs</text><text class="mono mut" x="370" y="661" text-anchor="middle">WordPress files, NFS :2049, /var/www/html, encrypted, TLS-only, backed up, mount target per AZ</text>
<path class="flow-o" d="M186 324 H30 V634" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ara)"/><path class="flow-o" d="M610 324 H710 V634" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ara)"/>
<rect x="20" y="680" width="960" height="62" rx="6" fill="#f3f6fa" stroke="#8793a6"/>
<text class="mono" x="34" y="698">ALB: CloudFront IPs + secret header only; web SG: 80 from ALB</text><text class="mono" x="34" y="714">Web egress: 443, 2049, 3306, 6379 (Redis) only</text><text class="mono" x="34" y="730">SSH closed (SSM Session Manager); role deham9-dev-web-role</text><text class="mono" x="500" y="698">IMDSv2 required, encrypted EBS and EFS (TLS mount)</text><text class="mono" x="500" y="714">Aurora private+encrypted; WordPress DB user, not master</text><text class="mono" x="500" y="730">HTTPS at CloudFront; flow logs; logs TLS-only</text>
<rect x="750" y="148" width="235" height="84" rx="4" fill="#fff" stroke="#1b2330" stroke-width="1.5"/><text x="867" y="168" text-anchor="middle" font-weight="600">S3 log buckets</text><text class="mono mut" x="867" y="184" text-anchor="middle">alb-logs: ALB access logs</text><text class="mono mut" x="867" y="198" text-anchor="middle">audit-logs: CloudFront, flow logs</text><text class="mono mut" x="867" y="212" text-anchor="middle">encrypted, expire after 14 days</text><line class="flow-k" x1="680" y1="168" x2="748" y2="178" stroke="#1b2330" stroke-width="1.5" marker-end="url(#ar)"/>
<rect class="cw" x="750" y="246" width="235" height="108" rx="4" fill="#fff" stroke="#1b2330" stroke-width="1.5"/><text x="867" y="266" text-anchor="middle" font-weight="600">CloudWatch</text><text class="mono mut" x="867" y="282" text-anchor="middle">dashboard deham9-dev-wordpress</text><text class="mono mut" x="867" y="296" text-anchor="middle">10 alarms -&gt; SNS: ALB, ASG, DB, EFS</text><text class="mono mut" x="867" y="310" text-anchor="middle">agent: memory, disk, Apache logs</text><text class="mono mut" x="867" y="324" text-anchor="middle">Aurora logs, kept 14 days</text><line x1="720" y1="300" x2="748" y2="300" stroke="#1b2330" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="618" y="482" width="78" height="54" rx="4" fill="#fff" stroke="#1b2330"/><text x="657" y="502" text-anchor="middle" font-weight="600">ElastiCache</text><text class="mono mut" x="657" y="516" text-anchor="middle">Redis cache</text><text class="mono mut" x="657" y="529" text-anchor="middle">1 node(s)</text>
<line class="flow-k" x1="590" y1="314" x2="650" y2="482" stroke="#1b2330" stroke-width="1.5" marker-end="url(#ar)"/>
<g transform="translate(750 412)"><text class="mono mut">ENVIRONMENT</text><text x="0" y="22">VPC 10.0.0.0/16</text><text x="0" y="40">Web: t4g.micro</text><text x="0" y="58">ASG: 5-6 (desired 5)</text><text x="0" y="76">Standalone EC2: 1</text><text x="0" y="94">Aurora: 1 x db.t3.small</text><text x="0" y="112">Backups: 1 days</text><text x="0" y="130">Deletion protection: off</text></g>
<g transform="translate(750 560)"><text class="mono mut">LEGEND</text><line class="flow-o" x1="0" y1="22" x2="40" y2="22" stroke="#c2410c" stroke-width="2" marker-end="url(#ara)"/><text x="52" y="26">inbound web request</text><line class="flow-k" x1="0" y1="48" x2="40" y2="48" stroke="#1b2330" stroke-width="1.5" marker-end="url(#ar)"/><text x="52" y="52">database call / logs</text><rect x="0" y="66" width="40" height="16" fill="#e3eefb" stroke="#8793a6"/><text x="52" y="79">public subnet</text><rect x="0" y="92" width="40" height="16" fill="#efeaf7" stroke="#8793a6"/><text x="52" y="105">private subnet</text></g>
